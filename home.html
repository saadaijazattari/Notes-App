<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes App</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- AOS CSS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>

<body class="bg-slate-100 min-h-screen p-6 ">

  <!-- App Container -->
  <div class="max-w-5xl mx-auto">

    <!-- Header (Top Slide) -->
    <header 
      data-aos="fade-down" 
      data-aos-duration="700"
      class="flex justify-between items-center mb-8"
    >
      <h1 class="text-3xl font-bold text-slate-800">🗒 Notes App</h1>

      <button id="logoutBtn" type="button"
        class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
        Logout
      </button>
    </header>

    <!-- Link -->


    <!-- Add Note (Zoom In) -->
    <!-- Add Note (Zoom In) -->
<div 
  data-aos="zoom-in" 
  data-aos-duration="800"
  class="bg-white p-4 rounded-xl shadow mb-8"
>
  <h2 class="text-lg font-semibold mb-3">Add New Note</h2>

  <div class="flex flex-col gap-3">

    <!-- Title -->
    <input
    id="noteTitle"
      type="text"
      placeholder="Note title"
      class="border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"
    />

    <!-- Description -->
    <textarea
    id="noteDescription"
      rows="3"
      placeholder="Note description"
      class="border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none resize-none"
    ></textarea>

    <!-- Image Upload -->
<div>
  <label class="text-sm text-slate-600 mb-1 block">Upload Picture</label>
  <input 
    type="file" 
    id="noteImage" 
    accept="image/*"
    class="border rounded-lg px-4 py-2 w-full bg-white
           focus:ring-2 focus:ring-indigo-500 outline-none"
  >
</div>


    <!-- Bottom row -->
    <div class="flex flex-col md:flex-row gap-3">

      <select id="importantSelection" class="border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500">
        <option value="important">Important</option>
        <option value="not important">Not Important</option>
      </select>

      <button
      id="addDataBtn"
        class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">
        Add Note
      </button>

    </div>

  </div>
</div>




<!-- modal -->
<!-- Button trigger modal -->


<!-- Modal -->
<!-- Modal -->
<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
  
  <div class="modal-dialog modal-dialog-centered">
    
    <div class="modal-content">
      
      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title">Update Note</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">

        <!-- Title -->
        <input
          id="updateTitle"
          type="text"
          placeholder="Note title"
          class="form-control mb-3"
        />

        <!-- Description -->
        <textarea
          id="updateDescription"
          rows="3"
          placeholder="Note description"
          class="form-control mb-3"
        ></textarea>

        <!-- Image Upload -->
        <div class="mb-3">
          <label class="form-label">Upload Picture</label>
          <input 
            type="file" 
            id="updateImage" 
            accept="image/*"
            class="form-control"
          >
        </div>

        <!-- Select -->
        <select id="updateImportant" class="form-select">
          <option value="important">Important</option>
          <option value="not important">Not Important</option>
        </select>

      </div>

      <!-- Footer -->
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button id="updateBtn" class="btn btn-primary">Update</button>
      </div>

    </div>

  </div>
</div>




<!-- modal end -->










    <!-- Notes Sections -->
    <div 
      data-aos="fade-up" 
      data-aos-delay="100"
      class="grid grid-cols-1 md:grid-cols-2 gap-6"
    >

      <!-- Important Notes (Left Slide) -->
      <section id="impNoteSec" data-aos="fade-right" data-aos-delay="200">
        
      </section>

      <!-- Other Notes (Right Slide) -->
      <section id="notImpNoteSec" data-aos="fade-left" data-aos-delay="200">
        
      </section>

      <div id="noDataDiv" class="hidden bg-red-500">No note</div>

    </div>
  </div>

  <!-- Your Script -->
  <script type="module" defer src="script.js"></script>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <!-- AOS JS -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


  <!-- AOS Init -->
  <script>
    AOS.init({
  duration: 800,
  once: false
})

  </script>

</body>
</html>
