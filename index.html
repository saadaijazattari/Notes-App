<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Notes App</title>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen font-['Space_Grotesk'] bg-gradient-to-br from-slate-50 via-white to-indigo-100 flex items-center justify-center px-4 py-10">

  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -top-24 -right-24 h-72 w-72 rounded-full bg-indigo-200/40 blur-3xl"></div>
    <div class="absolute -bottom-24 -left-24 h-72 w-72 rounded-full bg-sky-200/40 blur-3xl"></div>
  </div>

  <div class="relative bg-white/80 backdrop-blur w-full max-w-md p-8 rounded-2xl shadow-xl ring-1 ring-slate-200/70">
    <h1 class="text-3xl font-bold text-center text-slate-900 mb-2 tracking-tight">
      Welcome Back
    </h1>
    <p class="text-center text-slate-600 mb-6">
      Log in to access your notes and keep ideas organized.
    </p>

    <form class="space-y-4">
      <label class="block text-sm font-medium text-slate-700">Email</label>
      <input
        id="loginEmail"
        type="email"
        placeholder="Email address"
        class="w-full border border-slate-200 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none bg-white"
      />

      <label class="block text-sm font-medium text-slate-700">Password</label>
      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        class="w-full border border-slate-200 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none bg-white"
      />

      <button
        id="loginBtn"
        type="button"
        class="w-full bg-indigo-600 text-white py-2.5 rounded-lg hover:bg-indigo-700 transition font-semibold shadow-sm"
      >
        Login
      </button>
    </form>

    <div class="flex items-center my-4">
      <hr class="flex-grow border-t border-slate-300">
      <span class="mx-2 text-slate-400 text-xs tracking-widest">OR</span>
      <hr class="flex-grow border-t border-slate-300">
    </div>

    <button
      id="googleBtn"
      type="button"
      class="w-full flex items-center justify-center border border-slate-300 py-2.5 rounded-lg hover:bg-slate-100 transition bg-white"
    >
      <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo" class="w-5 h-5 mr-2">
      Continue with Google
    </button>

    <p class="text-center text-sm text-slate-500 mt-6">
      Don't have an account?
      <a href="signup.html" class="text-indigo-600 hover:underline font-medium">
        Sign up
      </a>
    </p>
  </div>

  <script type="module" src="script.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</body>
</html>
