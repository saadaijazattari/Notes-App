<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Notes App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center">

  <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-lg">
    
    <h1 class="text-3xl font-bold text-center text-slate-800 mb-2">
      Welcome Back 👋
    </h1>
    <p class="text-center text-slate-500 mb-6">
      Login to access your notes
    </p>

    <form class="space-y-4">
      <input
        id="loginEmail"
        type="email"
        placeholder="Email address"
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"
      />

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"
      />

      <button
        id="loginBtn"
        type="button"
        class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition"
      >
        Login
      </button>
    </form>

    <!-- OR separator -->
    <div class="flex items-center my-4">
      <hr class="flex-grow border-t border-slate-300">
      <span class="mx-2 text-slate-400">OR</span>
      <hr class="flex-grow border-t border-slate-300">
    </div>

    <!-- Google Sign-In button -->
    <button
      id="googleBtn"
      type="button"
      class="w-full flex items-center justify-center border border-slate-300 py-2 rounded-lg hover:bg-slate-100 transition"
    >
      <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo" class="w-5 h-5 mr-2">
      Continue with Google
    </button>

    <p class="text-center text-sm text-slate-500 mt-6">
      Don't have an account?
      <a href="signup.html" class="text-indigo-600 hover:underline">
        Sign up
      </a>
    </p>

  </div>


  <script type="module" src="script.js"></script>
</body>
</html>
