<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen p-6">

  <!-- App Container -->
  <div class="max-w-5xl mx-auto">

    <!-- Header -->
    <header class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-slate-800">🗒 Notes App</h1>
      <button id="logoutBtn" type="button" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">
        Logout
      </button>
    </header>

    <!-- Add Note -->
    <div class="bg-white p-4 rounded-xl shadow mb-8">
      <h2 class="text-lg font-semibold mb-3">Add New Note</h2>
      <div class="flex flex-col md:flex-row gap-3">
        <input
          type="text"
          placeholder="Note title"
          class="flex-1 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"
        />
        <select
          class="border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500"
        >
          <option value="important">Important</option>
          <option value="normal">Not Important</option>
        </select>
        <button class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700">
          Add
        </button>
      </div>
    </div>

    <!-- Notes Sections -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- Important Notes -->
      <section>
        <h2 class="text-xl font-semibold text-red-600 mb-4">🔥 Important Notes</h2>

        <div class="space-y-3">
          <div class="bg-red-50 border border-red-200 p-4 rounded-xl">
            <h3 class="font-semibold text-slate-800">Firebase Revision</h3>
            <p class="text-slate-600 text-sm mt-1">
              Auth, Firestore, security rules
            </p>
            <div class="flex justify-end gap-3 mt-3 text-sm">
              <button class="text-blue-600 hover:underline">Edit</button>
              <button class="text-red-500 hover:underline">Delete</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Not Important Notes -->
      <section>
        <h2 class="text-xl font-semibold text-slate-600 mb-4">📝 Other Notes</h2>

        <div class="space-y-3">
          <div class="bg-white border p-4 rounded-xl shadow-sm">
            <h3 class="font-semibold text-slate-800">Tailwind Practice</h3>
            <p class="text-slate-600 text-sm mt-1">
              Spacing, colors, layout
            </p>
            <div class="flex justify-end gap-3 mt-3 text-sm">
              <button class="text-blue-600 hover:underline">Edit</button>
              <button class="text-red-500 hover:underline">Delete</button>
            </div>
          </div>
        </div>
      </section>

    </div>

  </div>
  

  <script type="module" src="script.js"></script>

</body>
</html>
