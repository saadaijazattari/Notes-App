<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup | Notes App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center">

  <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-lg">
    
    <h1 class="text-3xl font-bold text-center text-slate-800 mb-2">
      Create Account ✨
    </h1>
    <p class="text-center text-slate-500 mb-6">
      Start saving your notes securely
    </p>

    <!-- Error Box -->
<div id="errorBox" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">

  <span class="block sm:inline" id="errorMsg">Something went wrong.</span>
  <span id="closeError" class="absolute top-0 bottom-0 right-0 px-4 py-3 cursor-pointer text-red-700 font-bold">×</span>d
</div>


    <form class="space-y-4">
      <input
      id="signupName"
        type="text"
        placeholder="Full name"
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"
      />

      <input
      id="signupEmail"
        type="email"
        placeholder="Email address"
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"
      />

      <input
      id="signupPassword"
        type="password"
        placeholder="Password"
        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"
      />

      <button
      id="signupBtn"
        type="button"
        class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition"
      >
        Sign Up
      </button>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
      Already have an account?
      <a href="login.html" class="text-indigo-600 hover:underline">
        Login
      </a>
    </p>

  </div>


  <script type="module" src="script.js"></script>

</body>
</html>
