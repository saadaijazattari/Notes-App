<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup | Notes App</title>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen font-['Space_Grotesk'] bg-gradient-to-br from-slate-50 via-white to-sky-100 flex items-center justify-center px-4 py-10">

  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -top-24 -left-24 h-72 w-72 rounded-full bg-emerald-200/40 blur-3xl"></div>
    <div class="absolute -bottom-24 -right-24 h-72 w-72 rounded-full bg-indigo-200/40 blur-3xl"></div>
  </div>

  <div class="relative bg-white/80 backdrop-blur w-full max-w-md p-8 rounded-2xl shadow-xl ring-1 ring-slate-200/70">
    <h1 class="text-3xl font-bold text-center text-slate-900 mb-2 tracking-tight">
      Create Account
    </h1>
    <p class="text-center text-slate-600 mb-6">
      Start saving your notes securely in one place.
    </p>

    <div id="errorBox" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg relative mb-4" role="alert">
      <span class="block sm:inline" id="errorMsg">Something went wrong.</span>
      <span id="closeError" class="absolute top-0 bottom-0 right-0 px-4 py-3 cursor-pointer text-red-700 font-bold">x</span>
    </div>

    <form class="space-y-4">
      <label class="block text-sm font-medium text-slate-700">Full name</label>
      <input
        id="signupName"
        type="text"
        placeholder="Full name"
        class="w-full border border-slate-200 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none bg-white"
      />

      <label class="block text-sm font-medium text-slate-700">Email</label>
      <input
        id="signupEmail"
        type="email"
        placeholder="Email address"
        class="w-full border border-slate-200 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none bg-white"
      />

      <label class="block text-sm font-medium text-slate-700">Password</label>
      <input
        id="signupPassword"
        type="password"
        placeholder="Password"
        class="w-full border border-slate-200 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 outline-none bg-white"
      />

      <button
        id="signupBtn"
        type="button"
        class="w-full bg-indigo-600 text-white py-2.5 rounded-lg hover:bg-indigo-700 transition font-semibold shadow-sm"
      >
        Sign Up
      </button>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
      Already have an account?
      <a href="index.html" class="text-indigo-600 hover:underline font-medium">
        Login
      </a>
    </p>
  </div>

  <script type="module" src="script.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</body>
</html>
